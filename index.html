<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harrison Zukas</title>
  <meta name="description" content="Personal website of Harrison Zukas.">
  <style>
    :root {
      --bg: #f6f5f2;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #f1f1f1;
        --muted: #9a9a9a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main {
      text-align: center;
      max-width: 28rem;
    }
    .photo {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <img class="photo" src="images/profile.jpg" alt="Harrison Zukas" width="220" height="220">
    <h1>Harrison Zukas</h1>
    <p>Site coming soon.</p>
  </main>
</body>
</html>
